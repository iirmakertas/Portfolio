<!DOCTYPE html>
<html>
<head>
  <title>Remove Greenscreen</title>
</head>
<body>
  <canvas id="canvas"></canvas>
  <textarea id="base64-data" style="width: 100%; height: 200px;"></textarea>
  <script>
    const img = new Image();
    img.src = 'profile_greenscreen_1783424012127.png';
    img.onload = () => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        
        // Greenscreen keying: high G, low R, low B
        if (g > 150 && r < 100 && b < 100) {
          data[i+3] = 0; // Alpha = 0 (transparent)
        }
      }
      
      ctx.putImageData(imgData, 0, 0);
      
      const dataUrl = canvas.toDataURL('image/png');
      document.getElementById('base64-data').value = dataUrl;
    };
  </script>
</body>
</html>
